name: Google Credential Presence Witness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-credential-presence:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            GOOGLE_API_KEY GEMINI_API_KEY GOOGLE_APPLICATION_CREDENTIALS_JSON \
            GOOGLE_CREDENTIALS GCP_SA_KEY GCP_PROJECT_ID GOOGLE_CLOUD_PROJECT \
            WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=PRESENT"
            else
              echo "$name=ABSENT"
            fi
          done

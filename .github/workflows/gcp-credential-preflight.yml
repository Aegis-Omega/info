name: GCP Credential Preflight

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
      HAS_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' }}
      HAS_GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON != '' }}
      HAS_WIF_PROVIDER_SECRET: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_SERVICE_ACCOUNT_SECRET: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}
      HAS_PROJECT_SECRET: ${{ secrets.GCP_PROJECT_ID != '' || secrets.GOOGLE_CLOUD_PROJECT != '' }}
      HAS_WIF_PROVIDER_VAR: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_SERVICE_ACCOUNT_VAR: ${{ vars.GCP_SERVICE_ACCOUNT != '' }}
      HAS_PROJECT_VAR: ${{ vars.GCP_PROJECT_ID != '' || vars.GOOGLE_CLOUD_PROJECT != '' }}
    steps:
      - name: Emit credential presence witness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          keys = [
              'HAS_GEMINI_API_KEY', 'HAS_GOOGLE_API_KEY', 'HAS_GCP_CREDENTIALS',
              'HAS_GOOGLE_CREDENTIALS_JSON', 'HAS_WIF_PROVIDER_SECRET',
              'HAS_SERVICE_ACCOUNT_SECRET', 'HAS_PROJECT_SECRET',
              'HAS_WIF_PROVIDER_VAR', 'HAS_SERVICE_ACCOUNT_VAR', 'HAS_PROJECT_VAR',
          ]
          witness = {k: os.environ.get(k, '').lower() == 'true' for k in keys}
          print(json.dumps(witness, sort_keys=True))
          with open('gcp-credential-preflight.json', 'w', encoding='utf-8') as f:
              json.dump(witness, f, indent=2, sort_keys=True)
          PY

      - name: Upload preflight witness
        uses: actions/upload-artifact@v4
        with:
          name: gcp-credential-preflight
          path: gcp-credential-preflight.json
          if-no-files-found: error
